<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Markdown editor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Weave: black over white, white over red, red over blue, blue over black.
       Those four constraints form a cycle, so no single stacking order works.
       The black vertical is split into two overlapping halves instead, one at
       the bottom of the stack and one at the top. The halves use butt caps so
       nothing sweeps across the join; the outer ends are rounded with circles.
       No clipping anywhere, so no seams. -->
  <rect width="512" height="512" rx="96" fill="#EDE0C2"/>

  <g fill="none">
    <!-- black, lower half: outline and its rounded end first, then the core -->
    <g stroke-linecap="butt">
      <path d="M167 244 L142 416" stroke="#2E2A22" stroke-width="50"/>
      <circle cx="142" cy="416" r="25" fill="#2E2A22" stroke="none"/>
      <path d="M167 244 L142 416" stroke="#1A1A1A" stroke-width="36"/>
      <circle cx="142" cy="416" r="18" fill="#1A1A1A" stroke="none"/>
    </g>

    <!-- blue -->
    <g stroke-linecap="round">
      <path d="M88 326 L360 318" stroke="#2E2A22" stroke-width="50"/>
      <path d="M88 326 L360 318" stroke="#1F4E82" stroke-width="36"/>
    </g>

    <!-- red -->
    <g stroke-linecap="round">
      <path d="M340 96 L294 416" stroke="#2E2A22" stroke-width="50"/>
      <path d="M340 96 L294 416" stroke="#B3311F" stroke-width="36"/>
    </g>

    <!-- white -->
    <g stroke-linecap="round">
      <path d="M104 194 L376 186" stroke="#2E2A22" stroke-width="50"/>
      <path d="M104 194 L376 186" stroke="#FFFFFF" stroke-width="36"/>
    </g>

    <!-- black, upper half: same order, so the core covers the outline ring -->
    <g stroke-linecap="butt">
      <path d="M188 96 L165 258" stroke="#2E2A22" stroke-width="50"/>
      <circle cx="188" cy="96" r="25" fill="#2E2A22" stroke="none"/>
      <path d="M188 96 L165 258" stroke="#1A1A1A" stroke-width="36"/>
      <circle cx="188" cy="96" r="18" fill="#1A1A1A" stroke="none"/>
    </g>
  </g>
</svg>
